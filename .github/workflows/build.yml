name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release and debug APKs
        run: |
              chmod +x gradlew
               ./gradlew --no-daemon --stacktrace assembleRelease assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Strata.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/Strata-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Strata-apk
          path: out/*.apk
