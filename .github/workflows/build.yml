name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Signs with the permanent key when the STRATA_KEYSTORE_B64 / STRATA_KEYSTORE_PASSWORD secrets exist
      # (so a new APK installs over the old one); otherwise with the debug key.
      - name: Build release and debug APKs
        env:
          KEYSTORE_B64: ${{ secrets.STRATA_KEYSTORE_B64 }}
          STRATA_KEYSTORE_PASSWORD: ${{ secrets.STRATA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/strata.jks"
            export STRATA_KEYSTORE_FILE="$RUNNER_TEMP/strata.jks"
          fi
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Strata.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/Strata-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Strata-apk
          path: out/*.apk

      # README screenshots: renders the real app with a sample library. Never blocks the APK build.
      - name: Make README screenshots
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest -Pscreenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Strata-screenshots
          path: out/screenshots/*.png
          if-no-files-found: warn
