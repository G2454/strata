name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The permanent signing key, from the repository secrets STRATA_KEYSTORE_B64 and STRATA_KEYSTORE_PASSWORD.
      # Without it the build still works, but signs with a throwaway key: Android then won't install it over
      # the previous build, and uninstalling first deletes playlists and play counts.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.STRATA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/strata.jks"
            echo "STRATA_KEYSTORE_FILE=$RUNNER_TEMP/strata.jks" >> "$GITHUB_ENV"
            echo "::notice::Signing with the permanent Strata key"
          else
            echo "::warning::No STRATA_KEYSTORE_B64 secret, signing with a throwaway key. This APK will not install over the previous one."
          fi

      - name: Build release and debug APKs
        env:
          STRATA_KEYSTORE_PASSWORD: ${{ secrets.STRATA_KEYSTORE_PASSWORD }}
        run: |
              chmod +x gradlew
               ./gradlew --no-daemon --stacktrace assembleRelease assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Strata.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/Strata-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Strata-apk
          path: out/*.apk

      # README screenshots: renders the real app with a sample library. Never blocks the APK build.
      - name: Make README screenshots
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest -Pscreenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Strata-screenshots
          path: out/screenshots/*.png
          if-no-files-found: warn
